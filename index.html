<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="The personal portfolio of ioconfidence.">
  <title>ioconfidence — Portfolio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20231f;
      background: #f7f7f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(2rem, 8vw, 4.5rem);
      background: #fff;
      border: 1px solid #e8e9e3;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgb(34 40 29 / 7%);
    }

    .eyebrow {
      margin: 0 0 1.25rem;
      color: #64734f;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 10vw, 5rem);
      line-height: 1;
      letter-spacing: -.065em;
    }

    .intro {
      max-width: 38ch;
      margin: 1.5rem 0 2.5rem;
      color: #62665f;
      font-size: 1.1rem;
      line-height: 1.75;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .8rem 1rem;
      border: 1px solid #e3e5dc;
      border-radius: 999px;
      color: #30362a;
      font-size: .95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
    }

    .links a:hover {
      transform: translateY(-2px);
      border-color: #cbd2bf;
      background: #f4f6f0;
    }

    .links a:focus-visible {
      outline: 3px solid #84966d;
      outline-offset: 3px;
    }

    footer {
      margin-top: 3rem;
      color: #858980;
      font-size: .85rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal portfolio</p>
    <h1>ioconfidence</h1>
    <p class="intro">Welcome to my corner of the internet. This is a simple place to find me and follow what I’m up to.</p>
    <nav class="links" aria-label="Social profiles">
      <a href="https://github.com/ioconfidence" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile (opens in a new tab)">
        <span aria-hidden="true">↗</span> GitHub
      </a>
      <a href="https://www.linkedin.com/in/ioconfidence/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)">
        <span aria-hidden="true">↗</span> LinkedIn
      </a>
    </nav>
    <footer>Thanks for stopping by.</footer>
  </main>
</body>
</html>
